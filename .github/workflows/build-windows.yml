name: Build Windows installer

# Tauri can't cross-build a Windows installer from macOS/Linux (MSVC + WebView2 +
# NSIS + a Windows PyInstaller backend are all Windows-only), so we build it on a
# Windows runner. Trigger manually, or on a v* tag.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: dtolnay/rust-toolchain@stable

      - uses: astral-sh/setup-uv@v5

      # Freeze against a standard python.org CPython (setup-python), NOT uv's
      # python-build-standalone interpreter — the standalone build, once frozen by
      # PyInstaller, can fail to load python3xx.dll on other Windows machines
      # (LoadLibrary access violation 998). only-system makes uv reuse this one.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 1) Freeze the Python backend into binaries/snowan-backend/snowan-backend.exe
      - name: Build backend (PyInstaller)
        working-directory: backend
        env:
          UV_PYTHON_PREFERENCE: only-system
          UV_PYTHON: '3.12'
        run: |
          uv sync
          uv pip install "pyinstaller>=6.0.0" "pyinstaller-hooks-contrib>=2024.9"
          uv run python -m PyInstaller "../frontend/src-tauri/scripts/snowan-backend.spec" --distpath "../dist/pyinstaller" --workpath "../dist/pyinstaller-build" --clean --noconfirm

      - name: Stage backend into Tauri resources
        run: |
          New-Item -ItemType Directory -Force -Path frontend/src-tauri/binaries | Out-Null
          if (Test-Path frontend/src-tauri/binaries/snowan-backend) { Remove-Item -Recurse -Force frontend/src-tauri/binaries/snowan-backend }
          Copy-Item -Recurse -Force dist/pyinstaller/snowan-backend frontend/src-tauri/binaries/snowan-backend
          if (-not (Test-Path frontend/src-tauri/binaries/snowan-backend/snowan-backend.exe)) { throw "backend exe missing" }

      # 2) Build the Tauri app -> NSIS (.exe) + MSI installers
      - name: Build Tauri app
        working-directory: frontend
        run: |
          npm ci
          npm run tauri:build

      - uses: actions/upload-artifact@v4
        with:
          name: snowan-windows-installer
          path: |
            frontend/src-tauri/target/release/bundle/nsis/*.exe
            frontend/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      # 3) Package the on-demand ML runtimes for Windows (NOT bundled in the app — the
      # app downloads them from the runtimes-v1 release on request; see runtimes.py) and
      # publish them to that release so Windows users can fetch them.
      - name: Package + publish Windows runtimes
        working-directory: backend
        shell: bash
        env:
          UV_PYTHON_PREFERENCE: only-system
          UV_PYTHON: '3.12'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh release view runtimes-v1 -R "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create runtimes-v1 -R "${{ github.repository }}" \
              --title "Snowan on-demand runtimes (v1)" \
              --notes "Per-platform ML runtimes downloaded on demand by the app." \
              --target "$GITHUB_SHA"
          for feat in embed voice; do
            case "$feat" in
              embed) pkgs="onnxruntime fastembed" ;;
              voice) pkgs="faster-whisper" ;;
            esac
            rm -rf rt && uv pip install --target rt $pkgs
            find rt -name '__pycache__' -type d -prune -exec rm -rf {} + 2>/dev/null || true
            tar -czf "snowan-${feat}-windows-x64.tar.gz" -C rt .
            gh release upload runtimes-v1 "snowan-${feat}-windows-x64.tar.gz" \
              --clobber -R "${{ github.repository }}"
          done
