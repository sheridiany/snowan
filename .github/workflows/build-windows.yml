name: Build Windows installer

# Tauri can't cross-build a Windows installer from macOS/Linux (MSVC + WebView2 +
# NSIS + a Windows PyInstaller backend are all Windows-only), so we build it on a
# Windows runner. Trigger manually, or on a v* tag.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: dtolnay/rust-toolchain@stable

      - uses: astral-sh/setup-uv@v5

      # Freeze against a standard python.org CPython (setup-python), NOT uv's
      # python-build-standalone interpreter — the standalone build, once frozen by
      # PyInstaller, can fail to load python3xx.dll on other Windows machines
      # (LoadLibrary access violation 998). only-system makes uv reuse this one.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 1) Freeze the Python backend into binaries/snowan-backend/snowan-backend.exe
      - name: Build backend (PyInstaller)
        working-directory: backend
        env:
          UV_PYTHON_PREFERENCE: only-system
          UV_PYTHON: '3.12'
        run: |
          uv sync
          uv pip install "pyinstaller>=6.0.0" "pyinstaller-hooks-contrib>=2024.9"
          uv run python -m PyInstaller "../frontend/src-tauri/scripts/snowan-backend.spec" --distpath "../dist/pyinstaller" --workpath "../dist/pyinstaller-build" --clean --noconfirm

      - name: Stage backend into Tauri resources
        run: |
          New-Item -ItemType Directory -Force -Path frontend/src-tauri/binaries | Out-Null
          if (Test-Path frontend/src-tauri/binaries/snowan-backend) { Remove-Item -Recurse -Force frontend/src-tauri/binaries/snowan-backend }
          Copy-Item -Recurse -Force dist/pyinstaller/snowan-backend frontend/src-tauri/binaries/snowan-backend
          if (-not (Test-Path frontend/src-tauri/binaries/snowan-backend/snowan-backend.exe)) { throw "backend exe missing" }

      # 2) Build the Tauri app -> NSIS (.exe) + MSI installers
      - name: Build Tauri app
        working-directory: frontend
        run: |
          npm ci
          npm run tauri:build

      - uses: actions/upload-artifact@v4
        with:
          name: snowan-windows-installer
          path: |
            frontend/src-tauri/target/release/bundle/nsis/*.exe
            frontend/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
