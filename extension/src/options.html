<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snowan 剪藏 · 设置</title>
    <style>
      :root {
        --bg: #fffaf4;
        --surface: #ffffff;
        --text: #2a2320;
        --muted: #8a7d72;
        --accent: #e8853a;
        --border: #f0e3d6;
        --ok: #16a34a;
        --err: #dc2626;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
        font-size: 14px;
        padding: 40px 20px;
      }
      .card {
        max-width: 520px;
        margin: 0 auto;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 28px;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 4px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .logo {
        width: 26px; height: 26px; border-radius: 50%;
        background: linear-gradient(135deg, #f6a256, var(--accent));
        color: #fff; display: flex; align-items: center; justify-content: center;
        font-size: 15px;
      }
      .sub { color: var(--muted); margin: 0 0 24px; font-size: 13px; }
      label { display: block; font-weight: 600; margin-bottom: 6px; }
      .hint { color: var(--muted); font-weight: 400; font-size: 12px; margin-top: 4px; }
      .field { margin-bottom: 22px; }
      input[type="text"] {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 9px;
        font: inherit;
        background: var(--bg);
      }
      input[type="text"]:focus { outline: 2px solid var(--accent); border-color: var(--accent); }
      .checkbox { display: flex; align-items: flex-start; gap: 10px; }
      .checkbox input { margin-top: 2px; }
      .checkbox label { font-weight: 600; margin: 0; }
      .row { display: flex; gap: 10px; align-items: center; }
      button {
        font: inherit; border: none; cursor: pointer; border-radius: 9px; padding: 10px 16px;
        font-weight: 600;
      }
      .primary { background: var(--accent); color: #fff; }
      .primary:hover { background: #d9742c; }
      .secondary { background: #f3e7da; color: #9a5418; }
      .secondary:hover { background: #ecdac9; }
      .status { font-size: 13px; min-height: 18px; margin-top: 12px; }
      .status.ok { color: var(--ok); }
      .status.err { color: var(--err); }
      .saved { color: var(--ok); font-size: 13px; margin-left: 10px; opacity: 0; transition: opacity 0.2s; }
      .saved.show { opacity: 1; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1><span class="logo">❄</span> Snowan 剪藏 · 设置</h1>
      <p class="sub">剪藏的内容只发送到你本机运行的 Snowan 桌面端,不会上传任何第三方服务器。</p>

      <div class="field">
        <label for="base">Snowan 后端地址</label>
        <input id="base" type="text" placeholder="http://127.0.0.1:8787" spellcheck="false" />
        <div class="hint">默认 http://127.0.0.1:8787。如修改了 Snowan 桌面端端口,请在此同步。</div>
      </div>

      <div class="field checkbox">
        <input id="capture-html" type="checkbox" />
        <div>
          <label for="capture-html">同时抓取页面 HTML</label>
          <div class="hint">默认仅抓取抽取后的正文文本。开启后会附带原始 HTML(后端当前接收但暂不存储)。</div>
        </div>
      </div>

      <div class="row">
        <button id="save" class="primary">保存</button>
        <button id="test" class="secondary">测试连接</button>
        <span id="saved" class="saved">已保存</span>
      </div>
      <div id="status" class="status"></div>
    </div>

    <script src="options.js"></script>
  </body>
</html>
