[project]
name = "snowan"
version = "0.1.0"
description = "Snowan agent backend — PydanticAI + FastAPI"
requires-python = ">=3.11"
dependencies = [
    "pydantic-ai>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/snowan"]
