[package]
name = "snowan"
version = "0.1.0"
description = "Snowan desktop app"
authors = []
license = ""
repository = ""
edition = "2021"

[lib]
name = "snowan_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "snowan"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-decorum = "1.1.0"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-log = "2"
log = "0.4"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
